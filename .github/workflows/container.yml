# Build the container on every version tag (vX.Y.Z or vX.Y.Z-suffix) and push it to GitHub Container Registry.
name: container
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/comet-meth:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/comet-meth:latest
      - name: smoke test
        run: docker run --rm ghcr.io/${{ github.repository_owner }}/comet-meth:${{ steps.v.outputs.version }} comet test --env-only
